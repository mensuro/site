[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Stylesheets, scripts and images use Netlify's default (revalidate on every visit, cheap 304s),
# so a deploy shows up immediately. Fonts never change, so they cache for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
